name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - run: flutter pub get
      - run: flutter build windows --release

      - name: Set version from tag
        shell: bash
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Output/Heavy-Setup-*.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi

      - name: Rename
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Heavy-${{ github.ref_name }}-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk Heavy-${{ github.ref_name }}-arm32.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Heavy-*.apk

  release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          repository: Ahmed2004abdelal/gymsystem-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: trueذ